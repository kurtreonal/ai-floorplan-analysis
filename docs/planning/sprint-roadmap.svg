<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2256 1060" role="img" aria-label="02 Delivery roadmap"><rect width="2256" height="1060" fill="#F6F7FA"/><text x="31" y="37.0" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#667085">VED ELECTRICAL SERVICES</text><text x="31" y="89.0" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17212B">Delivery roadmap</text><text x="31" y="130.0" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#475467">Sequence proposal | Later sprint dates and capacity remain uncommitted | Production acceptance depends on independent evidence</text><rect x="30" y="180" width="525" height="786" rx="8" fill="#FFFFFF" stroke="#D6DAE2"/><text x="31" y="578.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17212B"></text><text x="47" y="215.0" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#226B83">SPRINT 01</text><text x="47" y="276.0" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17212B">Stabilize the current workspace</text><text x="47" y="323.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#667085">Proposed: 12-23 Oct 2026</text><text x="47" y="387.0" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#17212B">Goal: Deliver a reviewable, regression-tested development baseline.</text><text x="47" y="458.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17212B">Baseline + lint</text><text x="47" y="506.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">SP-01 / SP-02: inventory, full baseline, catalog decision.</text><text x="47" y="564.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17212B">Integrate local work</text><text x="47" y="612.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">SP-03 / SP-04 / SP-10: magnets, draft BOM, source evidence.</text><text x="47" y="670.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17212B">Prove acceptance</text><text x="47" y="718.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">SP-06 / SP-07 / SP-08: live drag, units/prices, durability.</text><text x="47" y="776.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17212B">Close and document</text><text x="47" y="824.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">SP-05 / SP-09: status alignment and final regression gate.</text><text x="47" y="908.5" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#226B83">Exit: all sprint checks pass, or unresolved failures are explicitly</text><text x="47" y="927.5" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#226B83">deferred.</text><rect x="587" y="180" width="525" height="786" rx="8" fill="#FFFFFF" stroke="#D6DAE2"/><text x="588" y="578.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17212B"></text><text x="604" y="215.0" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#667085">SPRINT 02</text><text x="604" y="276.0" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17212B">Finish PDF reporting</text><text x="604" y="323.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#667085">After the Sprint 01 gate</text><text x="604" y="377.0" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#17212B">Goal: Export stored, versioned planning estimates as durable PDF</text><text x="604" y="397.0" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#17212B">reports.</text><text x="604" y="458.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17212B">Q1 - Report contract</text><text x="604" y="506.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">Freeze project, canonical layout, route and captured estimate references.</text><text x="604" y="564.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17212B">Q2 - PDF generation</text><text x="604" y="612.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">Readable tables, totals, date/user and planning wording.</text><text x="604" y="670.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17212B">Q3 - Report API</text><text x="604" y="718.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">Persist records; authorize generation/retrieval; retain original costs.</text><text x="604" y="776.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17212B">Q4 - Report UI</text><text x="604" y="824.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">Status, history, errors and reopening/downloading old reports.</text><text x="604" y="908.5" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#667085">Exit: a stored report still matches its estimate after Admin price</text><text x="604" y="927.5" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#667085">changes.</text><rect x="1144" y="180" width="525" height="786" rx="8" fill="#FFFFFF" stroke="#D6DAE2"/><text x="1145" y="578.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17212B"></text><text x="1161" y="215.0" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#75619C">SPRINT 03</text><text x="1161" y="276.0" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17212B">Complete audit traceability</text><text x="1161" y="323.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#667085">Sequence proposed; dates TBD</text><text x="1161" y="377.0" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#17212B">Goal: Make important actions traceable through a protected Admin</text><text x="1161" y="397.0" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#17212B">workflow.</text><text x="1161" y="458.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17212B">R1 - Audit foundation</text><text x="1161" y="506.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">Reusable service/table; safe user, action, entity and timestamp fields.</text><text x="1161" y="564.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17212B">R2 - Workflow events</text><text x="1161" y="612.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">Login, upload, review, routing, prices, estimates and reports.</text><text x="1161" y="670.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17212B">R3 - Admin viewer</text><text x="1161" y="718.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">Role-protected filters by user/action/date; sanitized details.</text><text x="1161" y="776.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17212B">S4-S6 - Regression</text><text x="1161" y="824.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">Alignment, multi-floor lengths, no-path behavior and price snapshots.</text><text x="1161" y="908.5" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#75619C">Exit: audit records are complete and Designers cannot read</text><text x="1161" y="927.5" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#75619C">unrestricted logs.</text><rect x="1701" y="180" width="525" height="786" rx="8" fill="#FFFFFF" stroke="#D6DAE2"/><text x="1702" y="578.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17212B"></text><text x="1718" y="215.0" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#9B4242">RELEASE TRACK</text><text x="1718" y="276.0" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#17212B">Earn production acceptance</text><text x="1718" y="323.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#667085">Evidence-gated; no fixed date</text><text x="1718" y="377.0" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#17212B">Goal: Keep development capability separate from measured</text><text x="1718" y="397.0" font-family="Arial,sans-serif" font-size="16" font-weight="400" fill="#17212B">production readiness.</text><text x="1718" y="458.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17212B">U3-U5 / S3 - Gold evidence</text><text x="1718" y="506.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">Approve source eligibility, reference pack, frozen gold and thresholds.</text><text x="1718" y="564.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17212B">U6 / U8 - Runtime choice</text><text x="1718" y="612.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">Select a real measured local model; validate health, privacy and resources.</text><text x="1718" y="670.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17212B">U9 / U10 - Training</text><text x="1718" y="718.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">Human-approved records and compute; register an evaluated adapter.</text><text x="1718" y="776.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17212B">U14 / T2-T3 - Release</text><text x="1718" y="824.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">Signed promotion, rollback drill, deployment and complete workflow proof.</text><text x="1718" y="908.5" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#9B4242">Exit: independent results and signed release evidence pass; retain</text><text x="1718" y="927.5" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#9B4242">YOLO until then.</text><text x="31" y="1017.0" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#475467">Stop at each ticket gate. No automatic model training, production promotion or engineering approval is implied by this plan.</text></svg>