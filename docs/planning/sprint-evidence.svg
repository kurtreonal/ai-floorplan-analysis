<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2256 1450" role="img" aria-label="03 Acceptance and evidence"><rect width="2256" height="1450" fill="#F6F7FA"/><text x="31" y="37.0" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#667085">VED ELECTRICAL SERVICES</text><text x="31" y="89.0" font-family="Arial,sans-serif" font-size="32" font-weight="700" fill="#17212B">Acceptance criteria and evidence</text><text x="31" y="130.0" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#475467">Snapshot: 12 Oct 2026 | Branch: codex/vlm-localization-experiment | HEAD: f605974 | Proposed owners, capacity and effort estimates remain unassigned</text><text x="31" y="197.0" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17212B">SPRINT EXIT CHECKLIST</text><rect x="30" y="218" width="230" height="86" rx="0" fill="#FFFFFF" stroke="#D6DAE2"/><text x="31" y="266.0" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17212B">SP-01 / SP-09</text><rect x="260" y="218" width="850" height="86" rx="0" fill="#FFFFFF" stroke="#D6DAE2"/><text x="261" y="266.5" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B">Run existing backend, frontend, build and lint gates; preserve the dirty tree and private artifacts.</text><rect x="30" y="306" width="230" height="86" rx="0" fill="#FFFFFF" stroke="#D6DAE2"/><text x="31" y="354.0" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17212B">SP-02</text><rect x="260" y="306" width="850" height="86" rx="0" fill="#FFFFFF" stroke="#D6DAE2"/><text x="261" y="354.5" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B">Resolve six reported catalog lint errors; do not silently add missing libraries or suppress checks.</text><rect x="30" y="394" width="230" height="86" rx="0" fill="#FFFFFF" stroke="#D6DAE2"/><text x="31" y="442.0" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17212B">SP-03 / SP-06</text><rect x="260" y="394" width="850" height="86" rx="0" fill="#FFFFFF" stroke="#D6DAE2"/><text x="261" y="442.5" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B">Native drag + click/keyboard paths; exact coordinates, cancel/disconnect, undo/redo and save/reload.</text><rect x="30" y="482" width="230" height="86" rx="0" fill="#FFFFFF" stroke="#D6DAE2"/><text x="31" y="530.0" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17212B">SP-04 / SP-07</text><rect x="260" y="482" width="850" height="86" rx="0" fill="#FFFFFF" stroke="#D6DAE2"/><text x="261" y="530.5" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B">Known quantities x captured prices; draft vs snapshot semantics; conversions; missing and stale inputs.</text><rect x="30" y="570" width="230" height="86" rx="0" fill="#FFFFFF" stroke="#D6DAE2"/><text x="31" y="618.0" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17212B">SP-08 / SP-10</text><rect x="260" y="570" width="850" height="86" rx="0" fill="#FFFFFF" stroke="#D6DAE2"/><text x="261" y="618.5" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B">No lost reviewed paths or attachments after reanalysis; source checksums and history remain intact.</text><rect x="30" y="658" width="230" height="86" rx="0" fill="#FFFFFF" stroke="#D6DAE2"/><text x="31" y="706.0" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17212B">SP-05</text><rect x="260" y="658" width="850" height="86" rx="0" fill="#FFFFFF" stroke="#D6DAE2"/><text x="261" y="706.5" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B">Re-measure counts and reconcile stale README claims with actual code and recent checkpoints.</text><rect x="30" y="746" width="230" height="86" rx="0" fill="#FFFFFF" stroke="#D6DAE2"/><text x="31" y="794.0" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17212B">Q1-Q4</text><rect x="260" y="746" width="850" height="86" rx="0" fill="#FFFFFF" stroke="#D6DAE2"/><text x="261" y="794.5" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B">Reports reference stored estimate/layout/route versions; unchanged historical totals; authenticated access.</text><rect x="30" y="834" width="230" height="86" rx="0" fill="#FFFFFF" stroke="#D6DAE2"/><text x="31" y="882.0" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17212B">R1-R3</text><rect x="260" y="834" width="850" height="86" rx="0" fill="#FFFFFF" stroke="#D6DAE2"/><text x="261" y="882.5" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B">Safe audit fields and role enforcement; no secrets or raw provider credentials in recorded details.</text><rect x="30" y="922" width="230" height="86" rx="0" fill="#FFFFFF" stroke="#D6DAE2"/><text x="31" y="970.0" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17212B">BL-01 / BL-03</text><rect x="260" y="922" width="850" height="86" rx="0" fill="#FFFFFF" stroke="#D6DAE2"/><text x="261" y="970.5" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#17212B">Independent gold, thresholds, rights, training authority and signed release; synthetic tests do not close these.</text><text x="31" y="1051.5" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17212B">DEPENDENCIES</text><text x="31" y="1125.0" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#475467">SP-01: None</text><text x="31" y="1144.0" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#475467">SP-02: SP-01</text><text x="31" y="1163.0" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#475467">SP-05: SP-01</text><text x="31" y="1182.0" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#475467">SP-09: SP-02..08 + SP-10</text><text x="31" y="1201.0" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#475467">SP-03: SP-01</text><text x="31" y="1220.0" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#475467">SP-04: SP-01</text><text x="31" y="1239.0" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#475467">SP-10: SP-01</text><text x="31" y="1258.0" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#475467">SP-06: SP-03</text><text x="31" y="1277.0" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#475467">SP-07: SP-04</text><text x="31" y="1296.0" font-family="Arial,sans-serif" font-size="15" font-weight="400" fill="#475467">SP-08: SP-03 + SP-10</text><text x="1141" y="197.0" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17212B">REPOSITORY EVIDENCE / STATUS LIMITS</text><text x="1141" y="237.5" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#17212B">AGENTS.md</text><text x="1141" y="283.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">Shared canonical geometry; server-authoritative prices; preserve originals; one ticket at a time.</text><text x="1141" y="330.5" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#17212B">docs/FUNCTIONAL_SPEC.md</text><text x="1141" y="376.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">Q1-Q4 define PDF reporting; R1-R3 define audit logging; S3-S6 define quality and calculation gates.</text><text x="1141" y="423.5" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#17212B">docs/U_VLM_PROGRESS.md</text><text x="1141" y="469.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">Latest October 12: endpoint magnets are local uncommitted work; native drag is inconclusive; 83 files / 684 frontend tests reported.</text><text x="1141" y="516.5" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#17212B">docs/PRE_VLM_READINESS_REPORT.md</text><text x="1141" y="562.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">Historical PRE12 foundation gate passed on September 6; this is not a production AI release.</text><text x="1141" y="609.5" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#17212B">docs/LOCAL_VLM_MIGRATION_PLAN.md</text><text x="1141" y="655.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">Real-data approval, independent evaluation, model selection, training and release remain distinct gates.</text><text x="1141" y="702.5" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#17212B">backend/app/main.py</text><text x="1141" y="748.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">Estimate/material routes are registered; no report or audit router is registered.</text><text x="1141" y="795.5" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#17212B">backend/app/api/routes/estimates.py</text><text x="1141" y="841.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">Versioned estimate endpoints and draft/historical BOM CSV endpoints exist.</text><text x="1141" y="888.5" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#17212B">backend/app/api/routes/materials.py</text><text x="1141" y="934.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">Admin-only workbook preview/apply endpoints exist.</text><text x="1141" y="981.5" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#17212B">frontend/src/features/estimation/BOMPanel.jsx</text><text x="1141" y="1027.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">Draft BOM UI, material/price/unit controls, paper dimensions and CSV export are present.</text><text x="1141" y="1074.5" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#17212B">frontend/src/features/detection-review/deviceConnections.js</text><text x="1141" y="1120.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">Shared endpoint connection logic exists in the current local work.</text><text x="1141" y="1167.5" font-family="Arial,sans-serif" font-size="13" font-weight="700" fill="#17212B">frontend/src/features/viewer-3d/DeviceMeshCatalog.jsx</text><text x="1141" y="1213.5" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">Untracked catalog imports @react-three/drei; ledger records six lint errors. Adoption/removal needs an explicit decision.</text><text x="1141" y="1272.0" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#17212B">Evidence status</text><text x="1141" y="1331.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">PASS: repository analysis, editable XML, card/criteria coverage, text-fit and preview checks.</text><text x="1141" y="1349.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">NOT TESTED: product regression in this task and opening the file in the diagrams.net editor.</text><text x="1141" y="1367.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#475467">Ledger results are historical evidence; they are not a new test execution or a complete release claim.</text></svg>