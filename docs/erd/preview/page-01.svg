<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 1640" role="img" aria-label="How to read this ERD"><rect width="1160" height="1640" fill="white"/><rect x="40" y="22" width="1080" height="26" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="46" y="41.0" font-family="Arial,sans-serif" font-size="15" font-weight="700" fill="#17212B">VED ELECTRICAL SERVICES</text><rect x="40" y="54" width="1080" height="42" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="46" y="86.5" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#17212B">How to read this ERD</text><rect x="40" y="99" width="1080" height="26" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="46" y="116.5" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#17212B">ENTITY RELATIONSHIP DIAGRAM / Live XAMPP schema / 07 October 2026</text><rect x="40" y="150" width="1080" height="38" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="46" y="177.5" font-family="Arial,sans-serif" font-size="20" font-weight="700" fill="#17212B">33 tables | 303 columns | 60 foreign-key relationships</text><rect x="40" y="212" width="1080" height="28" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="46" y="232.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17212B">What this diagram shows</text><rect x="40" y="241" width="1080" height="52" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="46" y="264.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17212B">The existing ved_electrical database, checked against the project models.</text><text x="46" y="281.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17212B">Each full table appears once. Small related-table boxes repeat a key as a continuation reference.</text><rect x="40" y="312" width="1080" height="28" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="46" y="332.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17212B">Read a relationship from left to right</text><rect x="40" y="341" width="1080" height="52" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="46" y="364.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17212B">The FK column on the left refers to the PK in the small box on the right.</text><text x="46" y="381.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17212B">See page NN tells you where that related table is shown in full.</text><rect x="40" y="412" width="1080" height="28" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="46" y="432.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17212B">Keys and optional fields</text><rect x="40" y="441" width="1080" height="52" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="46" y="464.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17212B">PK = primary key: uniquely identifies a row. FK = foreign key: refers to another table.</text><text x="46" y="481.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17212B">UQ = unique value. UQ together = the combination must be unique. NULL? Yes = optional.</text><rect x="40" y="512" width="1080" height="28" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="46" y="532.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17212B">Relationship counts</text><rect x="40" y="541" width="1080" height="52" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="46" y="564.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17212B">1 = exactly one. 0..1 = zero or one. 0..many = zero or more.</text><text x="46" y="581.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17212B">Example: many projects can refer to one user; each project must have one owner.</text><rect x="40" y="612" width="1080" height="28" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="46" y="632.5" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#17212B">Database details kept accurate</text><rect x="40" y="641" width="1080" height="52" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="46" y="664.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17212B">Only declared foreign keys have connectors. No relationship is inferred from a field name.</text><text x="46" y="681.0" font-family="Arial,sans-serif" font-size="14" font-weight="400" fill="#17212B">MariaDB stores JSON as LONGTEXT; boolean fields appear as TINYINT. Full metadata accompanies this file.</text><rect x="40" y="722" width="1080" height="32" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="46" y="745.0" font-family="Arial,sans-serif" font-size="17" font-weight="700" fill="#17212B">PAGE DIRECTORY</text><rect x="40" y="770" width="530" height="26" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="46" y="788.5" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17212B">02 Accounts and authority</text><rect x="67" y="797" width="505" height="38" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="73" y="820.5" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#17212B">roles, users, dataset_approver_assignments</text><rect x="40" y="839" width="530" height="26" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="46" y="857.5" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17212B">03 Projects and uploads</text><rect x="67" y="866" width="505" height="38" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="73" y="889.5" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#17212B">projects, project_floors, floor_plans</text><rect x="40" y="908" width="530" height="26" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="46" y="926.5" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17212B">04 Source pages and scale</text><rect x="67" y="935" width="505" height="38" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="73" y="958.5" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#17212B">floor_plan_sources, floor_plan_pages, page_scale_settings</text><rect x="40" y="977" width="530" height="26" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="46" y="995.5" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17212B">05 Floor elevation and jobs</text><rect x="67" y="1004" width="505" height="38" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="73" y="1027.5" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#17212B">floor_elevation_settings, processing_jobs</text><rect x="40" y="1046" width="530" height="26" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="46" y="1064.5" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17212B">06 Worker execution</text><rect x="67" y="1073" width="505" height="38" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="73" y="1096.5" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#17212B">processing_job_attempts, processing_job_cancellations</text><rect x="40" y="1115" width="530" height="26" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="46" y="1133.5" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17212B">07 Processing artifacts and AI runs</text><rect x="67" y="1142" width="505" height="38" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="73" y="1165.5" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#17212B">processing_artifacts, floor_plan_interpretation_runs</text><rect x="40" y="1184" width="530" height="26" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="46" y="1202.5" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17212B">08 AI outcomes and review</text><rect x="67" y="1211" width="505" height="38" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="73" y="1234.5" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#17212B">interpretation_page_outcomes, floor_plan_interpretation_reviews</text><rect x="40" y="1253" width="530" height="26" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="46" y="1271.5" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17212B">09 Model release register</text><rect x="67" y="1280" width="505" height="38" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="73" y="1303.5" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#17212B">interpretation_releases</text><rect x="40" y="1322" width="530" height="26" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="46" y="1340.5" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17212B">10 Symbol legend administration</text><rect x="67" y="1349" width="505" height="38" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="73" y="1372.5" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#17212B">symbol_legends, symbol_legend_history</text><rect x="590" y="770" width="530" height="26" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="596" y="788.5" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17212B">11 Detected symbols and walls</text><rect x="617" y="797" width="505" height="38" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="623" y="820.5" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#17212B">detected_symbols</text><rect x="590" y="839" width="530" height="26" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="596" y="857.5" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17212B">12 Detected symbols and walls - continuation 2</text><rect x="617" y="866" width="505" height="38" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="623" y="889.5" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#17212B">walls</text><rect x="590" y="908" width="530" height="26" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="596" y="926.5" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17212B">13 Detection review and corrections</text><rect x="617" y="935" width="505" height="38" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="623" y="958.5" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#17212B">detection_reviews, detection_class_corrections</text><rect x="590" y="977" width="530" height="26" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="596" y="995.5" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17212B">14 Manual symbol placement</text><rect x="617" y="1004" width="505" height="38" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="623" y="1027.5" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#17212B">manual_symbols</text><rect x="590" y="1046" width="530" height="26" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="596" y="1064.5" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17212B">15 Canonical layouts and saves</text><rect x="617" y="1073" width="505" height="38" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="623" y="1096.5" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#17212B">layout_versions, layout_save_requests</text><rect x="590" y="1115" width="530" height="26" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="596" y="1133.5" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17212B">16 Generated electrical routes</text><rect x="617" y="1142" width="505" height="38" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="623" y="1165.5" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#17212B">generated_route_versions</text><rect x="590" y="1184" width="530" height="26" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="596" y="1202.5" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17212B">17 Materials and price history</text><rect x="617" y="1211" width="505" height="38" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="623" y="1234.5" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#17212B">materials, material_prices</text><rect x="590" y="1253" width="530" height="26" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="596" y="1271.5" font-family="Arial,sans-serif" font-size="14" font-weight="700" fill="#17212B">18 Estimate snapshots</text><rect x="617" y="1280" width="505" height="38" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="623" y="1303.5" font-family="Arial,sans-serif" font-size="12" font-weight="400" fill="#17212B">estimates, estimate_items, estimate_sources</text><rect x="40" y="1535" width="1080" height="40" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="46" y="1560.0" font-family="Arial,sans-serif" font-size="13" font-weight="400" fill="#17212B">Continuation boxes represent existing tables, not additional tables. Lines are relationships, not workflow arrows.</text><rect x="40" y="1586" width="1000" height="26" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="46" y="1603.0" font-family="Arial,sans-serif" font-size="11" font-weight="400" fill="#17212B">PK primary key | FK foreign key | UQ unique | 1 exactly one | 0..1 optional one | 0..many any number</text><rect x="1050" y="1586" width="70" height="26" fill="#FFFFFF" stroke="none" stroke-width="0.7"/><text x="1077.0" y="1603.5" font-family="Arial,sans-serif" font-size="12" font-weight="700" fill="#17212B">01 / 18</text></svg>